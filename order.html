<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodieHub - Place Your Order</title>

    <meta name="description"
          content="Place your food order with FoodieHub.">

    <link rel="icon" href="images/favicon.png">
</head>

<body>

<header>
    <h1>FoodieHub</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="menu.html">Menu</a> |
        <a href="about.html">About</a> |
        <a href="order.html">Order Now</a> |
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <h2>Place Your Order</h2>

    <form action="#" method="post">

        <fieldset>

            <legend>Customer Information</legend>

            <p>
                <label for="fullname">Full Name:</label>
                <input type="text"
                       id="fullname"
                       name="fullname"
                       placeholder="Enter your full name"
                       required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </p>

            <p>
                <label for="phone">Phone:</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Enter your phone number"
                       required>
            </p>

            <p>
                <label for="address">Address:</label>
                <textarea id="address"
                          name="address"
                          rows="4"
                          cols="40"
                          placeholder="Enter your address"
                          required></textarea>
            </p>

        </fieldset>

        <fieldset>

            <legend>Food Selection</legend>

            <p>
                <label for="food">Select Food:</label>

                <select id="food" name="food" required>
                    <option value="">-- Select Food --</option>
                    <option value="pizza">Pizza</option>
                    <option value="burger">Burger</option>
                    <option value="pasta">Pasta</option>
                    <option value="biryani">Biryani</option>
                </select>
            </p>

            <p>
                <label for="quantity">Quantity:</label>

                <input type="number"
                       id="quantity"
                       name="quantity"
                       min="1"
                       max="10"
                       required>
            </p>

        </fieldset>

        <fieldset>

            <legend>Choose Size</legend>

            <p>
                <input type="radio"
                       id="small"
                       name="size"
                       value="small"
                       required>

                <label for="small">Small</label>
            </p>

            <p>
                <input type="radio"
                       id="medium"
                       name="size"
                       value="medium">

                <label for="medium">Medium</label>
            </p>

            <p>
                <input type="radio"
                       id="large"
                       name="size"
                       value="large">

                <label for="large">Large</label>
            </p>

        </fieldset>

        <fieldset>

            <legend>Extra Toppings</legend>

            <p>
                <input type="checkbox"
                       id="cheese"
                       name="toppings"
                       value="extra-cheese">

                <label for="cheese">Extra Cheese</label>
            </p>

            <p>
                <input type="checkbox"
                       id="jalapeno"
                       name="toppings"
                       value="jalapeno">

                <label for="jalapeno">Jalapeno</label>
            </p>

            <p>
                <input type="checkbox"
                       id="mushroom"
                       name="toppings"
                       value="mushroom">

                <label for="mushroom">Mushroom</label>
            </p>

            <p>
                <input type="checkbox"
                       id="olives"
                       name="toppings"
                       value="olives">

                <label for="olives">Olives</label>
            </p>

            <p>
                <input type="checkbox"
                       id="sauce"
                       name="toppings"
                       value="extra-sauce">

                <label for="sauce">Extra Sauce</label>
            </p>

        </fieldset>

        <fieldset>

            <legend>Add Drinks</legend>

            <label for="drinks">Select Drinks:</label>

            <select id="drinks"
                    name="drinks"
                    multiple
                    size="4">

                <option value="coke">Coke</option>
                <option value="pepsi">Pepsi</option>
                <option value="cold-coffee">Cold Coffee</option>
                <option value="lemonade">Lemonade</option>

            </select>

        </fieldset>

        <fieldset>

            <legend>Delivery Details</legend>

            <p>
                <label for="delivery-date">
                    Delivery Date:
                </label>

                <input type="date"
                       id="delivery-date"
                       name="delivery-date"
                       required>
            </p>

            <p>
                <label for="instructions">
                    Delivery Instructions:
                </label>

                <textarea id="instructions"
                          name="instructions"
                          rows="4"
                          cols="40"
                          placeholder="Enter delivery instructions..."></textarea>
            </p>

        </fieldset>

        <fieldset>

            <legend>Payment Method</legend>

            <p>
                <input type="radio"
                       id="cod"
                       name="payment"
                       value="cash"
                       required>

                <label for="cod">
                    Cash on Delivery
                </label>
            </p>

            <p>
                <input type="radio"
                       id="upi"
                       name="payment"
                       value="upi">

                <label for="upi">UPI</label>
            </p>

            <p>
                <input type="radio"
                       id="card"
                       name="payment"
                       value="card">

                <label for="card">
                    Credit/Debit Card
                </label>
            </p>

        </fieldset>

        <fieldset>

            <legend>Coupon</legend>

            <label for="coupon">
                Coupon Code:
            </label>

            <input type="text"
                   id="coupon"
                   name="coupon"
                   placeholder="Enter coupon code">

        </fieldset>

        <p>
            <input type="checkbox"
                   id="terms"
                   name="terms"
                   required>

            <label for="terms">
                I agree to the Terms & Conditions
            </label>
        </p>

        <button type="submit">
            Place Order
        </button>

        <button type="reset">
            Reset
        </button>

    </form>

</main>

<footer>
    <p>&copy; 2026 FoodieHub. All Rights Reserved.</p>
</footer>

</body>
</html>
