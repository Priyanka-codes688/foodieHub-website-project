<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodieHub - Contact</title>

    <meta name="description"
          content="Contact FoodieHub and send us your feedback.">

    <link rel="icon" href="images/favicon.png">
</head>

<body>

<header>

    <h1>FoodieHub</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="menu.html">Menu</a> |
        <a href="about.html">About</a> |
        <a href="order.html">Order Now</a> |
        <a href="contact.html">Contact</a>
    </nav>

</header>

<main>

    <section>

        <h2>Contact Information</h2>

        <article>

            <h3>FoodieHub</h3>

            <address>
                Lucknow, Uttar Pradesh
            </address>

            <p>
                Phone:
                <a href="tel:9876543210">
                    9876543210
                </a>
            </p>

            <p>
                Email:
                <a href="mailto:support@foodiehub.com">
                    support@foodiehub.com
                </a>
            </p>

        </article>

    </section>

    <section>

        <h2>Feedback Form</h2>

        <form action="#" method="post">

            <p>
                <label for="name">Name:</label>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>
            </p>

            <p>
                <label for="email">Email:</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </p>

            <fieldset>

                <legend>Rating</legend>

                <input type="radio"
                       id="rating1"
                       name="rating"
                       value="1"
                       required>
                <label for="rating1">1</label>

                <input type="radio"
                       id="rating2"
                       name="rating"
                       value="2">
                <label for="rating2">2</label>

                <input type="radio"
                       id="rating3"
                       name="rating"
                       value="3">
                <label for="rating3">3</label>

                <input type="radio"
                       id="rating4"
                       name="rating"
                       value="4">
                <label for="rating4">4</label>

                <input type="radio"
                       id="rating5"
                       name="rating"
                       value="5">
                <label for="rating5">5</label>

            </fieldset>

            <p>
                <label for="message">Message:</label>
            </p>

            <textarea id="message"
                      name="message"
                      rows="6"
                      cols="40"
                      placeholder="Write your feedback here..."
                      required></textarea>

            <p>
                <button type="submit">
                    Submit Feedback
                </button>

                <button type="reset">
                    Reset
                </button>
            </p>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 FoodieHub. All Rights Reserved.</p>
</footer>

</body>
</html>
